<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.webmanifest"><title>Photo Mystère</title><style>
*{box-sizing:border-box}body{margin:0;background:#111827;color:#f9fafb;font-family:system-ui,Arial,sans-serif}header{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;background:#1f2937;gap:12px}h1{font-size:1.3rem;margin:0}button,.button{background:#2563eb;border:0;color:white;border-radius:9px;padding:11px 15px;font-size:1rem;cursor:pointer}button:disabled{opacity:.4}button.secondary{background:#374151}button.danger{background:#991b1b}main{padding:14px;max-width:1300px;margin:auto}.hidden{display:none!important}.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.toolbar span{margin-right:auto}.board{position:relative;width:100%;height:calc(100dvh - 150px);min-height:260px;background:#030712;display:flex;align-items:center;justify-content:center;overflow:hidden}.photo-frame{position:relative;max-width:100%;max-height:100%;display:inline-block;line-height:0}.photo-frame img{display:block;max-width:100%;max-height:calc(100dvh - 150px);object-fit:contain}.tiles{position:absolute;inset:0;display:grid}.tile{display:flex;align-items:center;justify-content:center;background:#365a86;border:1px solid #8da9cb;color:white;font-weight:700;user-select:none;touch-action:manipulation;cursor:pointer;font-size:clamp(10px,2vw,24px);line-height:1}.tile.open{background:transparent;border:0;pointer-events:none}.panel{background:#1f2937;border-radius:12px;padding:16px;margin-bottom:14px}.photo-list{display:grid;gap:10px}.photo-item{display:flex;align-items:center;gap:10px;background:#374151;border-radius:9px;padding:9px;flex-wrap:wrap}.photo-item img{width:75px;height:55px;object-fit:cover;border-radius:5px}.photo-item strong{flex:1;min-width:120px}select,input{padding:10px;border-radius:7px;border:1px solid #6b7280;background:#111827;color:white;font-size:1rem}input[type=file]{max-width:100%}.muted{color:#cbd5e1}.empty{text-align:center;padding:35px}.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}@media(max-width:600px){.board{height:calc(100dvh - 185px)}.photo-frame img{max-height:calc(100dvh - 185px)}.tile{font-size:clamp(9px,2.6vw,16px)}button{padding:9px 11px;font-size:.9rem}}
</style></head><body><header><h1>🧩 Photo Mystère</h1><button id="switch" class="secondary">Mode jeu</button></header><main><section id="prep"><div class="panel"><h2>Préparer les photos</h2><p class="muted">Ajoute plusieurs images. Elles restent stockées sur cet appareil.</p><input id="files" type="file" accept="image/*" multiple><p class="muted" id="storage-note">Les photos sont sauvegardées dans le navigateur de cette tablette.</p></div><div class="panel"><h2>Photos du jeu</h2><div id="list" class="photo-list"></div></div></section><section id="game" class="hidden"><div class="toolbar"><span id="counter">Aucune photo</span><button id="reset" class="secondary">Recommencer</button><button id="reveal" class="secondary">Révéler tout</button><button id="next">Photo suivante →</button></div><div class="board" id="board"><div class="empty muted">Ajoute des photos dans la préparation pour commencer.</div></div></section></main><script>
const $=id=>document.getElementById(id);let db,photos=[],current=0,opened=new Set(),mode='prep',objectUrls=[];
function tx(store,mode='readonly'){return db.transaction(store,mode).objectStore(store)}
function req(r){return new Promise((ok,no)=>{r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
async function init(){db=await new Promise((ok,no)=>{let r=indexedDB.open('photo-mystere-v1',1);r.onupgradeneeded=()=>r.result.createObjectStore('photos',{keyPath:'id',autoIncrement:true});r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});await reload();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});}
async function reload(){photos=await req(tx('photos').getAll());photos.sort((a,b)=>a.order-b.order);current=Math.min(current,Math.max(photos.length-1,0));renderList();renderGame()}
function cleanUrls(){objectUrls.forEach(URL.revokeObjectURL);objectUrls=[]}function url(blob){let u=URL.createObjectURL(blob);objectUrls.push(u);return u}
function renderList(){cleanUrls();const list=$('list');list.replaceChildren();if(!photos.length){list.textContent='Aucune photo ajoutée.';return}photos.forEach((p,i)=>{let el=document.createElement('div');el.className='photo-item';let img=document.createElement('img');img.src=url(p.blob);el.append(img);let name=document.createElement('strong');name.textContent=p.name;el.append(name);let select=document.createElement('select');[64,100,144].forEach(n=>{let o=document.createElement('option');o.value=n;o.textContent=n+' cases';o.selected=p.count===n;select.append(o)});select.onchange=async()=>{p.count=Number(select.value);await req(tx('photos','readwrite').put(p));renderGame()};el.append(select);[['↑',()=>move(i,-1)],['↓',()=>move(i,1)],['Supprimer',()=>remove(p.id)]].forEach(([label,fn])=>{let b=document.createElement('button');b.textContent=label;b.className=label==='Supprimer'?'danger':'secondary';b.disabled=(label==='↑'&&i===0)||(label==='↓'&&i===photos.length-1);b.onclick=fn;el.append(b)});list.append(el)})}
async function move(i,d){let j=i+d;if(j<0||j>=photos.length)return;let a=photos[i],b=photos[j],order=a.order;a.order=b.order;b.order=order;await Promise.all([req(tx('photos','readwrite').put(a)),req(tx('photos','readwrite').put(b))]);await reload()}
async function remove(id){if(!confirm('Supprimer cette photo ?'))return;await req(tx('photos','readwrite').delete(id));opened.clear();await reload()}
$('files').onchange=async e=>{let files=Array.from(e.target.files);let order=photos.length?Math.max(...photos.map(p=>p.order))+1:0;for(let f of files){if(!f.type.startsWith('image/'))continue;try{await req(tx('photos','readwrite').add({name:f.name,blob:f,count:100,order:order++}))}catch(err){alert('Impossible de stocker '+f.name+' : espace insuffisant ou stockage indisponible.');break}}e.target.value='';await reload()};
$('switch').onclick=()=>{mode=mode==='prep'?'game':'prep';$('prep').classList.toggle('hidden',mode!=='prep');$('game').classList.toggle('hidden',mode!=='game');$('switch').textContent=mode==='prep'?'Mode jeu':'Préparation';renderGame()};
function renderGame(){if(mode!=='game')return;const board=$('board');board.replaceChildren();if(!photos.length){board.innerHTML='<div class="empty muted">Ajoute des photos dans la préparation pour commencer.</div>';$('counter').textContent='Aucune photo';return}let p=photos[current];$('counter').textContent=`Photo ${current+1} / ${photos.length} — ${p.name} — ${opened.size}/${p.count} cases`;let frame=document.createElement('div');frame.className='photo-frame';let img=document.createElement('img');img.src=URL.createObjectURL(p.blob);img.onload=()=>URL.revokeObjectURL(img.src);frame.append(img);let tiles=document.createElement('div');tiles.className='tiles';let cols=Math.sqrt(p.count);tiles.style.gridTemplateColumns=`repeat(${cols},1fr)`;tiles.style.gridTemplateRows=`repeat(${cols},1fr)`;for(let i=1;i<=p.count;i++){let tile=document.createElement('div');tile.className='tile'+(opened.has(i)?' open':'');tile.textContent=opened.has(i)?'':i;tile.onclick=()=>{opened.add(i);tile.classList.add('open');tile.textContent='';$('counter').textContent=`Photo ${current+1} / ${photos.length} — ${p.name} — ${opened.size}/${p.count} cases`};tiles.append(tile)}frame.append(tiles);board.append(frame)}
$('reset').onclick=()=>{opened.clear();renderGame()};$('reveal').onclick=()=>{if(!photos.length)return;opened=new Set(Array.from({length:photos[current].count},(_,i)=>i+1));renderGame()};$('next').onclick=()=>{if(!photos.length)return;current=(current+1)%photos.length;opened.clear();renderGame()};
init().catch(e=>{console.error(e);alert('Stockage local indisponible. Utilise Chrome ou un navigateur compatible.')});
</script></body></html>
